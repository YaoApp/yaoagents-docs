slug: getting-started
title: 入门
summary: 从安装到理解产品核心，用户必读。
pages:
  - slug: what-is-yao-agents
    title: 什么是 Yao Agents
    summary: 产品定位、核心价值、你能用它做什么。末尾附术语速查卡片。
  - slug: installation
    title: 安装
    summary: 在 macOS / Windows / Linux 上下载安装，像装普通 App 一样简单。
  - slug: ai-experts-intro
    title: AI 专家：找对人，事半功倍
    summary: 核心概念 1。每个 AI 专家都是对应领域的专才。如何选对专家、如何描述需求、如何获得最佳结果。
  - slug: what-is-kanban
    title: 任务看板：可视化管理任务
    summary: 核心概念 3。在可视化看板上组织任务、分配给 AI 执行、追踪进度。
  - slug: what-is-inbox
    title: 收件箱：不错过任何进展
    summary: 核心概念 4。智能通知中心，实时推送任务事件，支持直接回复 AI 提问。
  - slug: mission-control-intro
    title: 任务控制中心：编排自动化
    summary: 核心概念 2。你来编排——拉一组专家组成团队，定义流程，让它们自动协作完成。
  - slug: connect-to-server
    title: 连接云服务器
    summary: 跳过本地安装——连接一台托管的 Yao Agents 服务器，即刻使用 AI 专家。
  - slug: whats-next
    title: 更进一步
    summary: 产品还有更多能力：Tai Link 连接多设备、集成接入 IM / API、Yao Agents Hub 扩展新助手。

slug: built-in-agents
title: Built-in Agents
summary: "All pre-installed agents. Each has a detail page: intro, strengths, use cases, prompt reference, tips."
pages:
  - slug: general
    title: General
    summary: General-purpose assistant. Everyday Q&A, versatile tasks, best starting point for new users.
  - slug: pm
    title: PM
    summary: Project manager. Task breakdown, progress tracking, team coordination.
  - slug: postman
    title: Postman
    summary: Email assistant. Draft emails, scheduled sending, email templates.
  - slug: insights
    title: Insights
    summary: Data analyst. Connect to databases, read spreadsheets, build ECharts dashboards with live VNC preview.
  - slug: scout
    title: Market Scout
    summary: Market intelligence. Monitor subscription feeds, classify articles, organize insights.
  - slug: slides
    title: Slides
    summary: Slide deck builder. Turn outlines or documents into themed HTML presentations, export to PDF.
  - slug: transformer
    title: Transformer
    summary: Data structuring expert. Convert images, PDFs, JSON, and CSV into structured formats via Vision LLM.
  - slug: website
    title: Web Builder
    summary: Website builder. Corporate sites, landing pages, forms — Next.js + Tailwind, VNC preview, SSH deploy.
  - slug: applet
    title: Applet Workshop
    summary: Mini-app builder. Rapidly generate visual tools with Node.js, live VNC preview.
  - slug: report-writer
    title: Report Writer
    summary: Report-writing robot (used in Mission Control). Auto-generates structured Markdown analysis reports.
  - slug: robot-host
    title: Robot Host
    summary: "Pipeline agent — Intake stage. Human-machine intermediary: collects input, reports status, confirms decisions."
  - slug: robot-goals
    title: Robot Goals
    summary: Pipeline agent — Goal-setting stage. Understands requirements and breaks them into actionable goals.
  - slug: robot-inspiration
    title: Robot Inspiration
    summary: Pipeline agent — Inspiration stage. Searches for relevant information and reference materials.
  - slug: robot-tasks
    title: Robot Tasks
    summary: Pipeline agent — Execution stage. Carries out work step-by-step according to goals.
  - slug: robot-validation
    title: Robot Validation
    summary: Pipeline agent — Validation stage. Checks output quality and identifies issues.
  - slug: robot-delivery
    title: Robot Delivery
    summary: Pipeline agent — Delivery stage. Assembles final deliverables and formats output.

slug: getting-started
title: はじめに
summary: インストールから製品のコアを理解するまで、必読ガイド。
pages:
  - slug: what-is-yao-agents
    title: Yao Agents とは
    summary: 製品の位置づけ、コアバリュー、何ができるか。用語クイックリファレンス付き。
  - slug: installation
    title: インストール
    summary: macOS / Windows / Linux でダウンロードしてインストール。
  - slug: ai-experts-intro
    title: AI エキスパート：適切な専門家を選ぶ
    summary: コアコンセプト 1。各 AI エキスパートは専門分野のスペシャリストです。適切なエキスパートの選び方、要件の伝え方、最良の結果を得る方法。
  - slug: what-is-kanban
    title: タスクボード：タスクをビジュアルに管理
    summary: コアコンセプト 3。ビジュアルボードでタスクを整理し、AIに割り当て、進捗を追跡。
  - slug: what-is-inbox
    title: 受信トレイ：進捗を見逃さない
    summary: コアコンセプト 4。タスクイベントをリアルタイムで通知し、AIの質問に直接回答できるスマート通知センター。
  - slug: mission-control-intro
    title: ミッションコントロール：自動化のオーケストレーション
    summary: コアコンセプト 2。あなたが指揮者です。専門家チームを編成し、ワークフローを定義して自動連携させます。
  - slug: connect-to-server
    title: サーバーへの接続
    summary: Yao Agents クライアントをサーバーに接続し、アドレスを設定してサインインする方法。
  - slug: whats-next
    title: 次のステップ
    summary: さらなる機能の概要：Tai Link、統合、Yao Agents Hub。各機能の一行紹介とリンク。

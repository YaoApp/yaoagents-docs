slug: built-in-agents
title: 組み込みエージェント
summary: 製品にプリインストールされた全エージェント。各詳細ページあり。
pages:
  - slug: deepseek-harness
    title: DeepSeek Harness（汎用エージェント）
    summary: DeepSeek Harness 搭載の汎用エージェント。コーディング、リサーチ、データ分析、ライティング、自動化——永続サンドボックス、ターミナル・ブラウザ・VNC 完備。
  - slug: claude-code
    title: Claude Code（汎用エージェント）
    summary: Claude Code 搭載の汎用エージェント。コーディング、リサーチ、データ分析、ライティング、自動化——永続サンドボックスとライブプレビュー。
  - slug: agent-smith
    title: Agent Smith（専属エキスパート作成）
    summary: 要件を伝えるだけで、カスタムAIエキスパートを自動作成・テスト・デプロイ。
  - slug: insights
    title: Insights（データ分析）
    summary: データベース接続、スプレッドシート読み込み、EChartsダッシュボード構築、VNCライブプレビュー。
  - slug: slides
    title: Slides（スライド作成）
    summary: アウトラインや文書からHTML形式のプロスライドを生成し、PDFエクスポート。
  - slug: transformer
    title: Transformer（データ変換）
    summary: 画像・PDF・JSON・CSVを構造化形式に変換、Vision LLM OCR対応。
  - slug: website
    title: Web Builder（ウェブサイト構築）
    summary: 企業サイト・ランディングページ・フォームアプリ、Next.js + Tailwind、VNCプレビュー + SSHデプロイ。
  - slug: applet
    title: Applet Workshop（ミニアプリ）
    summary: Node.jsでビジュアルミニツールを素早く生成、VNCライブプレビュー。
  - slug: robot-host
    title: Robot Host（受付）
    summary: パイプラインエージェント。入力収集、ステータスフィードバック。
  - slug: robot-goals
    title: Robot Goals（目標設定）
    summary: パイプラインエージェント。要件理解、実行可能な目標に分解。
  - slug: robot-inspiration
    title: Robot Inspiration（インスピレーション）
    summary: パイプラインエージェント。情報検索、参考資料収集。
  - slug: robot-tasks
    title: Robot Tasks（実行）
    summary: パイプラインエージェント。目標に沿って作業を実行。
  - slug: robot-validation
    title: Robot Validation（検証）
    summary: パイプラインエージェント。成果物の品質検証。
  - slug: robot-delivery
    title: Robot Delivery（納品）
    summary: パイプラインエージェント。最終成果物の整理・出力。
